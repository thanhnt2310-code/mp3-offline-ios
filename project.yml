name: MP3Offline
options:
  bundleIdPrefix: com.thanhnt
  deploymentTarget:
    iOS: "16.0"
targets:
  MP3Offline:
    type: application
    platform: iOS
    sources:
      - MP3Offline
    info:
      path: MP3Offline/Info.plist
      properties:
        CFBundleDisplayName: MP3 Offline
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhnt.mp3offline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
